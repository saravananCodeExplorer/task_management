<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        .back {
            margin-left: 10px;
        }

        .errorlist {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>{{ title }}</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Task
        </button>

        <a href="{% url 'task_list' %}" class="back">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
