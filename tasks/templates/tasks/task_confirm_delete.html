<!DOCTYPE html>
<html>
<head>
    <title>Delete Task</title>
</head>

<body>

<h2>Delete Task</h2>

<p>
    Are you sure you want to delete
    <strong>{{ task.title }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

    <a href="{% url 'task_list' %}">
        Cancel
    </a>

</form>

</body>
</html>
